repository_role: canonical
documentation_class: A
one_sentence: >-
  Danse is a seeded, browser-based photographic artwork that turns one 2017
  dancer session and a hand-cut composite into an unbounded, reproducible room
  of moving image and sound.
problem: >-
  The project asks how a finite photographic record can become a time-based work
  without losing the provenance, spatial continuity, and specific history of its
  source images.
intended_users:
  - general viewers
  - artists, curators, scholars, and educators
  - engineers and media technologists
  - presenters and production partners
  - evaluators and collaborators
implementation_status: ACTIVE
