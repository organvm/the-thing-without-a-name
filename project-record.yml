limitations:
  - id: release-draft
    statement: >-
      The public project package and finite screendance package remain draft;
      deployment of the immersive root artwork is not final release approval.
    assertion_ref: docs/evidence/assertions/danse-release-is-draft.json
    assertion_id: danse-release-is-draft
  - id: installation-unproven
    statement: >-
      The installation is a reference design and simulator with blocked physical
      venue, hardware, calibration, recovery, and restore predicates.
    assertion_ref: docs/evidence/assertions/danse-installation-reference-only.json
    assertion_id: danse-installation-reference-only
  - id: rights-pending
    statement: >-
      Performer, pictured-object, music, press-still, identity, and publication
      approvals remain pending in the draft rights and release records.
    assertion_ref: docs/evidence/assertions/danse-attribution-boundaries.json
    assertion_id: danse-attribution-boundaries
  - id: deployment-receipt-precedes-head
    statement: >-
      The recorded public artwork replay is bound to source commit f19244a, which
      precedes the current canonical branch.
    assertion_ref: docs/evidence/assertions/danse-public-artwork-deployment.json
