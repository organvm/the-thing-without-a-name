# ScreenDance Miami 2027 — the submission register.
#
# Every fact about this call lives here, once, with its source and the date it was
# checked. Nothing about the deadline or the specs is carried in prose, in a plan,
# or in anyone's head — those drift silently (this register exists because a stale
# "11:00pm" and a page reading "11:59pm" coexisted for a week without either being
# wrong enough to notice).
#
# Two statuses, and the distinction is the whole point:
#   verified   the call states it; `source` and `checked` say where and when
#   unstated   the call is silent; `resolve` says how to find out, `assume` says
#              what we build meanwhile, `blocking` says whether shipping without
#              the answer is a real risk
#
# `check.py` reads this file and validates a staged package against it. Manual
# requirements declare the first phase that owns them; later phases are
# cumulative. A package cannot be asked to prove an upload or portal act that
# has not happened yet.

schema: danse.submission.v2
opportunity_snapshot:
  snapshot_id: omega-20260901
  path: opportunities/omega-20260901.json
  sha256: "4e003cf1e05d400d06da9a852bcb130a1faf6d138622c026c4298835afbfdfb3"
  receipt: opportunities/omega-20260901.receipt.json
  frozen_at: "2026-09-01T02:40:40Z"
  opportunity_id: screendance-miami-2027
  timezone: America/New_York
call: ScreenDance Miami Festival 2027
presenter: Miami Light Project
portal: https://miamilightproject.submittable.com/submit
program_page: https://miamilightproject.com/program/screen-dance-2027/
phone: "305.576.4350"

deadline:
  status: conflicted
  stated: "Submittable: Monday, August 31, 2026 at 11:00 PM EST; program page: 11:59 PM"
  sources: [submittable, program-page]
  checked: 2026-08-26
  # These are conflicting official statements, not a timezone conversion. Literal
  # 11:00 PM EST is midnight EDT on this date. The earlier 10:00 PM local wall is a
  # deliberately conservative internal filing buffer that leaves at least one hour
  # before either published reading; it does not assert how Submittable is configured.
  hard_wall: "2026-08-31T22:00:00-04:00"
  upload_target: "2026-08-31T18:00:00-04:00"
  target_file_date: "2026-08-31"

decision:
  notification: "end of October 2026"
  screening: "20–24 January 2027, venues across Miami-Dade"
  status: verified
  source: submittable
  checked: 2026-07-30

eligibility:
  status: verified
  scope: worldwide
  who: "dancers, choreographers, movers, and filmmakers"
  # The published invitation is worldwide. It does not state age eligibility, so
  # this register makes no claim that an age gate does or does not exist.
  source: submittable
  checked: 2026-07-30

# ── Hard requirements. These are the ones that reject a package outright. ────────

requirements:
  - id: final-cut-only
    phase: package
    status: verified
    rule: "Final versions only — works-in-progress are not accepted."
    source: submittable
    checked: 2026-07-30
    check: manual   # a human asserts this; no script can know a cut is final

  - id: link-password-protected
    phase: uploaded
    status: verified
    rule: "The video link must be password-protected."
    source: submittable
    checked: 2026-07-30
    check: manual

  - id: link-downloadable
    phase: uploaded
    status: verified
    rule: "The video link must have download enabled."
    source: submittable
    checked: 2026-07-30
    # The single most-missed requirement in this call: Vimeo ships with download
    # OFF by default, so a correct-looking link fails the panel silently.
    check: manual

  - id: submitted-via-submittable
    phase: submitted
    status: verified
    rule: "Electronic submission through the Submittable portal only."
    source: submittable
    checked: 2026-07-30
    check: manual

# Filing also carries published legal/operational terms. They are separate from
# artifact requirements because they bind the applicant's later choices and an
# accepted film's lifecycle, not the bytes in the staged package. `check.py`
# still assigns them to the submitted phase so no agent can infer assent from a
# successful upload.
terms:
  - id: accepted-film-no-withdrawal
    phase: submitted
    status: verified
    trigger: acceptance
    rule: "After acceptance to ScreenDance Miami 2027, the film cannot be withdrawn."
    source: https://miamilightproject.submittable.com/submit
    checked: 2026-08-03
    check: manual

  - id: publicity-stills-free-of-rights
    phase: submitted
    status: verified
    trigger: official-selection
    rule: "After official selection, publicity material such as still images must be supplied free of rights and may be used to promote ScreenDance Miami without time or place limits."
    source: https://miamilightproject.submittable.com/submit
    checked: 2026-08-03
    check: manual

  - id: submission-rights-warranty
    phase: submitted
    status: verified
    trigger: filing
    rule: "By submitting the film, the applicant declares that they hold all rights to share every aspect of the film and have cleared rights with the composer, musicians, dancers, and all other film collaborators."
    source: https://miamilightproject.submittable.com/submit
    checked: 2026-08-26
    check: manual

  - id: festival-scheduling-discretion
    phase: submitted
    status: verified
    trigger: filing
    rule: "General scheduling and the timetable of screenings are at the festival's discretion."
    source: https://miamilightproject.submittable.com/submit
    checked: 2026-08-26
    check: manual

  - id: archive-library-choice
    phase: submitted
    status: verified
    trigger: filing
    rule: "Record whether the film may enter the ScreenDance Miami video-library archive; the form permits an explicit opt-out."
    source: https://miamilightproject.submittable.com/submit
    checked: 2026-08-03
    check: choice
    values: [include, opt-out]

  - id: regulations-accepted
    phase: submitted
    status: verified
    trigger: filing
    rule: "Entry implies unconditional acceptance of the regulations, and festival management makes final decisions."
    source: https://miamilightproject.submittable.com/submit
    checked: 2026-08-03
    check: manual

# Internal artist approvals are package gates, not claims made by the call. They
# live here because they govern the same staged attest.yaml and must not be
# inferred from the existence of tracked prose.
approvals:
  - id: bio-approved
    phase: package
    status: internal
    rule: "The artist has verified the staged biographical claims."
    source: artist
    check: manual

  - id: rights-declaration-approved
    phase: package
    status: internal
    rule: "The artist has verified the staged authorship and rights claims."
    source: artist
    check: manual

# ── Unpublished. The call does not state these; one phone call closes all four. ──

unstated:
  - id: runtime-cap
    resolve: "Call 305.576.4350 — ask the maximum accepted runtime."
    assume_max_seconds: 480        # the ceiling of the declared passage range
    # Raised from 390 on 2026-07-31. 390 was the duration of a fixed cut, and the
    # work no longer has one: it is a river with no end, and a capture of one
    # whole passage runs 5:07–7:56 depending on which passage it caught. 480 is
    # the top of the range `check-danse.py` holds the program to, so the number
    # here and the number the engine can produce cannot drift apart.
    #
    # De-blocked by evidence, not by assumption: the 2026 festival programmed
    # "17 short films and three feature-length films". A festival that seats
    # features does not reject eight minutes on length.
    evidence: "2026 program: 17 shorts + 3 feature-length, 24 films / 6 countries"
    evidence_source: https://miamilightproject.com/program/screendance-miami-festival-2026/
    checked: 2026-07-30
    blocking: false

  - id: codec-and-master-format
    resolve: "Call — ask deliverable spec for selected films (ProRes? H.264? DCP?)."
    assume_master: "ProRes 422 HQ"
    assume_screener: "H.264, 1080p or 2160p"
    blocking: false                # a re-export is cheap; the cut is unaffected

  - id: aspect-ratio
    resolve: "Call — ask preferred aspect, and whether the Soundscape wall projection differs."
    assume: "16:9"
    blocking: false

  - id: premiere-status
    resolve: "Call — ask whether prior online/festival exhibition disqualifies."
    # Was blocking because the plan contemplates a European premiere (Mignolo,
    # 13 Oct 2026) landing BEFORE the Miami notification at end of October.
    # De-blocked: the 2026 open call seated "Florida, U.S., and world premieres"
    # — a Florida-premiere tier exists, so prior exhibition elsewhere re-tiers the
    # premiere rather than disqualifying the film.
    evidence: "2026 open-call selections spanned Florida, U.S., and world premieres"
    evidence_source: https://miamilightproject.com/program/screendance-miami-festival-2026/
    checked: 2026-07-30
    blocking: false

  - id: entry-fee
    resolve: "Confirm at the Submittable payment step when filing."
    assume: "none"
    evidence: "Miami Light Project states ScreenDance Miami accepts submissions for no charge"
    checked: 2026-07-30
    blocking: false

# ── The package. What check.py validates on disk. ───────────────────────────────

package:
  classification: internal-delivery-spec
  published_requirement: false
  note: "Project-owned production and delivery targets; the call does not publish these codec, raster, frame-rate, aspect, audio, still, or text specifications."
  master:
    required: true
    min_width: 3840
    min_height: 2160
    fps_allowed: [24, 30]
    aspect: "16:9"
    video_codec: prores
    video_profile: HQ
    audio_codec: pcm_s24le
    audio_channels: 2
  screener:
    required: true
    min_width: 1920
    min_height: 1080
    video_codec: h264
    audio_codec: aac
    audio_channels: 2
  audio:
    target_lufs: -16.0
    tolerance_lu: 0.5
    max_true_peak_dbtp: -1.0
    usage_contract:
      path: sound/audio-uses.json
      sha256: "d312487481ca456c4f26357b18fef7f0f58b5d8ae4a3dc5e687895d9c98f53e4"
      schema: danse.audio.uses.v1
      profile: competition-classical
    score_source: provenance/passage-score.wav
    audio_render_receipt: provenance/audio-render.json
    score_receipt_schema: danse.score.receipt.v2
    production_receipt: provenance/production.json
    credit: "Music by Léo Delibes. Source arrangements by Paul De Bra, adapted and re-orchestrated for Danse under CC BY 4.0. Changes include instrumentation, sequencing, cue markers, and mix."
    hybrid_apartment:
      profile: hybrid-apartment
      package_eligible: false
      note: "Post-filing only; these private sources are forbidden from the competition package."
      private_source_recordings:
        IMG_0226.MOV: "01bc6e147166061fe886b498a5dbd9e3c3f8fb9abb91f651f64bc9878f21e84b"
        IMG_0227.MOV: "64203a17367688b4b643bf6a1251ad2e37d63f49238cb6c9db7214ef6595f430"
  stills:
    required: true
    count_min: 6
    min_width: 3840
    min_height: 2160
    # One still per distinct seed, with the seed in the filename, so the generative
    # claim is material before the panel presses play.
    filename_pattern: "^seed-0x[0-9A-Fa-f]{4,}\\.(jpg|jpeg|png)$"
    distinct_seeds: true
  origin_still:
    required: true
    # One unaltered 2017 photograph, so the corpus is visible as photography.
    filename: "origin-2017.jpg"
    source_filename: "IMG_1594.JPG"
    source_sha256: "72b4f8f1c553c40bd4ec2de9956d547493ed17aaa5eabe172260c2156c8fde42"
    copy_mode: byte-identical
  trailer:
    required: false
    max_seconds: 45
    note: "One unbroken camera move through one seed. No cuts."
  text:
    synopsis_short: { required: true, words_min: 35, words_max: 60 }
    synopsis_long:  { required: true, words_min: 150, words_max: 250 }
    artist_statement: { required: true, words_min: 100, words_max: 500 }
    bio: { required: true, words_min: 50, words_max: 200 }
    technical_note: { required: true, words_min: 30, words_max: 300 }
    rights_declaration: { required: true, words_min: 20, words_max: 300 }
