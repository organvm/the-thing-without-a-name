<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">The Thing Without a Name — LinkedIn score-map visual</title>
  <desc id="desc">A white landscape graphic. At left is the project’s colored provenance map of 256 regions drawn from 77 source records. At right, black text reads: The edit becomes the choreographer. The Thing Without a Name. A dance film built from photographs. Film, score, archive, instrument. Madison Garber. Anthony J. Padavano.</desc>
  <rect width="1200" height="627" fill="#ffffff"/>
  <image x="42" y="42" width="700" height="525" preserveAspectRatio="xMidYMid slice" href="data:image/png;base64,"/>
  <rect x="41" y="41" width="702" height="527" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="42" y="600" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#000000">PROVENANCE MAP  ·  256 REGIONS  ·  77 SOURCE RECORDS</text>
  <line x1="779" y1="42" x2="779" y2="585" stroke="#000000" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#000000">
    <text x="816" y="68" font-size="17" font-weight="700">THE EDIT BECOMES</text>
    <text x="816" y="92" font-size="17" font-weight="700">THE CHOREOGRAPHER</text>
    <text x="816" y="194" font-size="56" font-weight="700">THE THING</text>
    <text x="816" y="255" font-size="56" font-weight="700">WITHOUT</text>
    <text x="816" y="316" font-size="56" font-weight="700">A NAME</text>
    <line x1="816" y1="339" x2="1148" y2="339" stroke="#000000" stroke-width="2"/>
    <text x="816" y="389" font-size="24">A DANCE FILM BUILT</text>
    <text x="816" y="421" font-size="24">FROM PHOTOGRAPHS</text>
    <text x="816" y="473" font-size="17">film / score / archive / instrument</text>
    <text x="816" y="544" font-size="16" font-weight="700">MADISON GARBER</text>
    <text x="816" y="568" font-size="16" font-weight="700">ANTHONY J. PADAVANO</text>
  </g>
</svg>
