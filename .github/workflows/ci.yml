name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reader-mode-docs:
    name: Reader-mode contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ORGANVM_ENGINE_SHA: 5caed5c03613a537b6b66c64376977db4fbc5c91
      SCHEMA_DEFINITIONS_SHA: 4ee0d31e1c6f1f8400e3b910237132ab561fe79f
      PROJECT_RECORD_SCHEMA_SHA256: c86e08dfdb6cb53ff5b7d8d6d9fd1e1cad48327ca2f332951a19b90f9118bd7d
      ASSERTION_EVIDENCE_SCHEMA_SHA256: 33726f63c4ab90a2f30aee4f5e6a8cbc1f510f5d7fec7e16963c322240590dd3
    steps:
      - name: Checkout candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout canonical schemas
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: organvm-iv-taxis/schema-definitions
          ref: ${{ env.SCHEMA_DEFINITIONS_SHA }}
          path: .work/reader-mode/schema-definitions
          persist-credentials: false

      - name: Checkout validation runtime
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: organvm/organvm-engine
          ref: ${{ env.ORGANVM_ENGINE_SHA }}
          path: .work/reader-mode/organvm-engine
          persist-credentials: false

      - name: Verify immutable dependency heads
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .work/reader-mode/schema-definitions rev-parse HEAD^{commit})" = "$SCHEMA_DEFINITIONS_SHA"
          test "$(git -C .work/reader-mode/organvm-engine rev-parse HEAD^{commit})" = "$ORGANVM_ENGINE_SHA"
          test -z "$(git -C .work/reader-mode/schema-definitions status --porcelain)"
          test -z "$(git -C .work/reader-mode/organvm-engine status --porcelain)"
          printf '%s  %s\n' \
            "$PROJECT_RECORD_SCHEMA_SHA256" \
            .work/reader-mode/schema-definitions/schemas/project-record-v1.schema.json \
            | sha256sum --check --strict -
          printf '%s  %s\n' \
            "$ASSERTION_EVIDENCE_SCHEMA_SHA256" \
            .work/reader-mode/schema-definitions/schemas/assertion-evidence.v1.schema.json \
            | sha256sum --check --strict -

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned validation runtime
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          .work/reader-mode/organvm-engine

      - name: Validate reader-mode documentation
        run: |
          organvm docs validate project-record.yml \
            --root . \
            --schema .work/reader-mode/schema-definitions/schemas/project-record-v1.schema.json \
            --assertion-schema .work/reader-mode/schema-definitions/schemas/assertion-evidence.v1.schema.json \
            --require-git-tracked-evidence \
            --actual-repository organvm/the-thing-without-a-name \
            --json

  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: python -m pip install '.[media]'
      - run: python scripts/check-danse.py
      - run: python scripts/tests/pages-artifact.test.py
      - run: python scripts/tests/release-manifest.test.py
      - run: python scripts/tests/rights.test.py
      - run: python scripts/tests/danse-delivery.test.py
      - run: python release/frames/test_score_motion_contract.py
      - run: node scripts/tests/interaction.test.mjs
      - run: python -m py_compile render/*.py pipeline/*.py sound/*.py submission/*.py scripts/*.py
      - run: node --check interaction/adapter.js && node --check interaction/camera.js && node --check interaction/controller.js && node --check interaction/session.js
      - run: node --check sound/control.mjs
      - run: bash -n done.sh
