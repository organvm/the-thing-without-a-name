name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: python -m pip install '.[media]'
      - run: python scripts/check-danse.py
      - run: python scripts/tests/pages-artifact.test.py
      - run: python scripts/tests/release-manifest.test.py
      - run: python scripts/tests/rights.test.py
      - run: python scripts/tests/danse-delivery.test.py
      - run: python release/frames/test_score_motion_contract.py
      - run: node scripts/tests/interaction.test.mjs
      - run: python -m py_compile render/*.py pipeline/*.py sound/*.py submission/*.py scripts/*.py
      - run: node --check interaction/adapter.js && node --check interaction/camera.js && node --check interaction/controller.js && node --check interaction/session.js
      - run: node --check sound/control.mjs
      - run: bash -n done.sh
